<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Observing</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #FFF200;
        font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #bubbles {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
      }
      #hud-1 {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }
      #hud-1 svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="bubbles"></canvas>
      <div id="status">불러오는 중...</div>

      <!-- Circular porthole frame. Its fill (id="hud1-frame") is driven from
           main.js, in sync with the look-mode/stage background color. -->
      <div id="hud-1">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
          <defs>
            <mask id="hud1-porthole-mask">
              <rect width="1920" height="1080" fill="white" />
              <circle cx="968" cy="555" r="670" fill="black" />
            </mask>
          </defs>

          <rect id="hud1-frame" width="1920" height="1080" fill="#FFF200" mask="url(#hud1-porthole-mask)" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
