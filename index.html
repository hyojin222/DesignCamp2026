<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Observing</title>
    <!-- One family per script the word list (below) actually needs glyphs
         for — Google Fonts doesn't ship one "Noto Sans" covering all of
         these, so the font-family stacks list every one of them and the
         browser picks whichever actually has the glyph for each character.
         Noto Sans itself already covers Latin/Cyrillic/Greek, so there's no
         separate "Noto Sans Greek" request. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Noto+Sans+Arabic:wght@400;500&family=Noto+Sans+Georgian:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+Sinhala:wght@400;500&family=Noto+Sans+Thai:wght@400;500&display=swap"
    />
    <style>
      :root {
        --font-noto: "Noto Sans KR", "Noto Sans", "Noto Sans JP", "Noto Sans SC", "Noto Sans Thai", "Noto Sans Arabic",
          "Noto Sans Hebrew", "Noto Sans Georgian", "Noto Sans Sinhala", system-ui, sans-serif;
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: var(--font-noto);
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
      }
      /* Solid-color loading screen: sits above everything (hud/buttons
         included) from first paint, so nothing underneath — the goggle mask
         fallback shape, the button's fallback icon — is ever actually
         visible while it's still settling into its final state. Hidden once
         every async load (models + goggle mask + button icon, see the
         Promise.all in main.js) has settled. Color matches BG_YELLOW_COLOR
         in main.js — keep the two in sync if that constant ever changes. */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: #fff075;
        transition: opacity 0.3s ease;
      }
      #loading-screen.loading-screen-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #hud-1 {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }
      #hud-1 svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Real (unmasked) copy of the goggle shape, painted transparent and
         sitting on top of #hud1-frame in the same SVG — its only job is
         hit-testing. #hud-1 is pointer-events: none so clicks fall through
         to the canvas everywhere except here, where this element opts back
         into auto: fill="transparent" (not "none") still counts as
         "painted" for hit-testing, so the shape is interactive despite
         being invisible, and its bounds are exactly the visible cutout's
         since main.js sizes/shapes it identically to the mask's own path
         (see applyGoggleMaskBox/loadGoggleMask). The pointerdown/move/up
         listeners for drag-to-rotate are attached to the outer, never-
         replaced #hud1-svg rather than this element directly (which
         loadGoggleMask() swaps out wholesale once the live shape loads) —
         they still only ever fire from within this shape, since it's the
         only thing under #hud1-svg with pointer-events on, and the event
         bubbles up to it either way. */
      #hud1-goggle-hit {
        pointer-events: auto;
        cursor: grab;
      }
      #hud1-goggle-hit:active {
        cursor: grabbing;
      }
      /* Set on #hud1-svg while debugMode's free-roam TrackballControls is
         active, so this shape stops intercepting drag input from the whole
         canvas underneath it. */
      #hud1-svg.goggle-hit-disabled #hud1-goggle-hit {
        pointer-events: none;
      }
      #btn-random-object {
        position: fixed;
        left: 50%;
        bottom: 30px;
        z-index: 200;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        pointer-events: auto;
        opacity: 1;
        /* translateX(-50%) is relative to the element's own width, so its
           midpoint (not its left edge) lands on the 50% viewport line —
           folded into every transform value below (base/hover/spin) since
           each one overwrites `transform` wholesale, not just the rotation.
           --spin (an integer turn count, bumped once per completed spin in
           main.js) keeps every rule's rotate() built off the *same*
           ever-growing angle instead of wrapping back to a fixed 0deg/-14deg.
           Without that, handing off from the spin animation's end angle
           (which keeps climbing: 346deg, 706deg, 1066deg, ...) back to a
           rule pinned at a fixed small angle is a huge numeric gap, and the
           0.25s transition covers that whole gap just as fast as the short
           hops it's meant for — reading as an instant snap instead of an
           eased return, right whenever the mouse leaves the button mid-spin
           or the instant after a click. Building every rule off --spin
           keeps that gap at a constant 14deg no matter how many spins have
           played. */
        transform: translateX(-50%) rotate(calc(var(--spin, 0) * 360deg));
        transition: transform 0.25s ease;
      }
      #btn-random-object:hover {
        transform: translateX(-50%) rotate(calc(var(--spin, 0) * 360deg - 14deg));
      }
      /* One-shot clockwise spin on click, toggled via .spin in main.js
         (removed again on 'animationend' so it can replay every click). An
         active animation overrides the :hover transform above for its
         duration — starting from that same -14deg tilt (instead of snapping
         to 0 first) so a hover-then-click reads as one continuous motion,
         and ending a full turn past it so it lands back at the tilt too.
         forwards keeps the element pinned at the end-of-spin angle for the
         instant between the animation finishing and 'animationend' actually
         removing the class — without it (default fill-mode: none) the style
         can revert a frame early, which is its own small source of the same
         kind of jump this rule is otherwise trying to avoid. main.js bumps
         --spin in that same 'animationend' handler, so the moment the class
         drops, the hover/base rules above already agree with where this
         animation just left off. --spin-tilt (also main.js, kept live off
         hover enter/leave the whole time the button exists, not just during
         a spin) is what that agreement depends on: it's -14deg while
         hovered and 0deg while not, so the 'to' keyframe below lands on
         exactly the hover or base rule's own angle for whichever one
         applies once the class drops — including a hover/unhover that
         happens mid-spin, since a running animation still re-resolves a
         var() every frame. */
      #btn-random-object.spin {
        animation: btn-random-object-spin 0.7s ease-out forwards;
      }
      @keyframes btn-random-object-spin {
        from {
          transform: translateX(-50%) rotate(calc(var(--spin, 0) * 360deg - 14deg));
        }
        to {
          transform: translateX(-50%) rotate(calc((var(--spin, 0) + 1) * 360deg + var(--spin-tilt, -14deg)));
        }
      }
      #btn-random-object svg {
        display: block;
        width: 164px;
        height: 164px;
        fill: #fff81f;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="status">불러오는 중...</div>
      <div id="loading-screen"></div>

      <!-- Goggle-shaped porthole frame. Its fill (id="hud1-frame") is driven
           from main.js, in sync with the scene background color. The
           viewBox width (id="hud1-svg") and this mask's/frame's rect widths
           are also kept in sync with the window's actual aspect ratio from
           main.js (syncHudViewBox()) — with a fixed 1920x1080 viewBox,
           "slice" crops whichever dimension overflows the real window
           aspect ratio, which cropped the now-edge-to-edge goggle shape's
           left/right sides on any window that wasn't exactly 16:9. -->
      <div id="hud-1">
        <svg id="hud1-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
          <defs>
            <mask id="hud1-porthole-mask">
              <rect id="hud1-mask-bg" width="1920" height="1080" fill="white" />
              <!-- Fallback shape for before main.js fetches the live
                   source/layout/goggle.svg (see loadGoggleMask() there) and
                   replaces this element outright — kept as a baked copy of
                   that file's current path so the two never visibly
                   disagree. This is only ever visible for an instant behind
                   #loading-screen anyway (see above), but stays synced as a
                   belt-and-suspenders match: re-copy the path here whenever
                   that source file's shape changes. -->
              <svg id="hud1-goggle-shape" viewBox="0 0 1975.98 1038.2" preserveAspectRatio="xMidYMid meet">
                <path fill="black" d="M1811.84,167.41C1651.52,16.7,1396.05,0,987.99,0S324.47,16.7,164.15,167.41C28.29,295.13,0,419.56,0,554.87c0,145.68,77.51,446.18,387.46,477.1,271.45,27.08,373.56-36.1,431.81-150.06,30.76-60.18,70.43-157.62,99.16-236.13,28.23-77.15,57.15-80.61,69.56-80.61s41.33,3.45,69.56,80.61c28.73,78.51,68.4,175.96,99.16,236.13,58.25,113.96,160.36,177.14,431.8,150.06,309.95-30.92,387.46-331.42,387.46-477.1,0-135.31-28.29-259.74-164.15-387.46Z" />
              </svg>
            </mask>
          </defs>

          <rect id="hud1-frame" width="1920" height="1080" fill="#292929" mask="url(#hud1-porthole-mask)" />

          <!-- Real (unmasked) copy of the goggle shape, purely for hit-testing
               — see the #hud1-goggle-hit CSS rule above. Kept as a baked
               fallback copy of the same path as hud1-goggle-shape above until
               main.js's loadGoggleMask() replaces both with the live one. -->
          <svg id="hud1-goggle-hit" viewBox="0 0 1975.98 1038.2" preserveAspectRatio="xMidYMid meet">
            <path fill="transparent" d="M1811.84,167.41C1651.52,16.7,1396.05,0,987.99,0S324.47,16.7,164.15,167.41C28.29,295.13,0,419.56,0,554.87c0,145.68,77.51,446.18,387.46,477.1,271.45,27.08,373.56-36.1,431.81-150.06,30.76-60.18,70.43-157.62,99.16-236.13,28.23-77.15,57.15-80.61,69.56-80.61s41.33,3.45,69.56,80.61c28.73,78.51,68.4,175.96,99.16,236.13,58.25,113.96,160.36,177.14,431.8,150.06,309.95-30.92,387.46-331.42,387.46-477.1,0-135.31-28.29-259.74-164.15-387.46Z" />
          </svg>
        </svg>
      </div>

      <!-- Bottom-right: the random-object button (jumps to a different
           random object, excluding the last 3 seen). This inline svg is only
           the fallback shown before loadButtonIcon() fetches the live
           source/icon/re.svg (copied to public/icon/ by
           scripts/generate-assets.mjs) and replaces it outright — kept as a
           baked copy of that file's current path so the two never visibly
           disagree (only ever visible for an instant behind #loading-screen
           anyway). Re-copy the path here whenever that source file changes. -->
      <button id="btn-random-object" type="button" aria-label="랜덤 오브제">
        <svg viewBox="0 -960 960 960"><path d="M196-194v-22h134l-50-49q-48-47-71-99.5T186-476q0-90 50-165t134-111v23q-74 34-118 102.5T208-476q0 56 21 104t62 87l56 54v-136h22v173H196Zm394-14v-23q75-34 118.5-102.5T752-484q0-51-21-100.5T670-674l-56-55v136h-22v-173h173v22H631l49 50q48 47 71 101.5T774-484q0 90-50 165T590-208Z"/></svg>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
