<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>낯선 식탁</title>
    <!-- One family per script the word list (below) actually needs glyphs
         for — Google Fonts doesn't ship one "Noto Sans" covering all of
         these, so the font-family stacks list every one of them and the
         browser picks whichever actually has the glyph for each character.
         Noto Sans itself already covers Latin/Cyrillic/Greek, so there's no
         separate "Noto Sans Greek" request. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Noto+Sans+Arabic:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Georgian:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+Sinhala:wght@400;500&family=Noto+Sans+Thai:wght@400;500&display=swap"
    />
    <!-- The top-left typewriter word readout (main.js's updateTypewriter) uses
         this for its Korean/Latin text; --font-word-pop below falls back to
         --font-noto for every other script it can show (Cyrillic, Chinese,
         Japanese, Thai, Hindi, Arabic, Hebrew) since Pyeojin Gothic itself
         only ships Korean/Latin glyphs. -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/Jihwan-Suh/PyeojinGothic/CSS/pyeojin-font.css"
    />
    <style>
      :root {
        --font-noto: "Noto Sans KR", "Noto Sans", "Noto Sans JP", "Noto Sans SC", "Noto Sans Thai", "Noto Sans Arabic",
          "Noto Sans Hebrew", "Noto Sans Georgian", "Noto Sans Devanagari", "Noto Sans Sinhala", system-ui, sans-serif;
        --font-word-pop: "PyeojinGothic", var(--font-noto);
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff075;
        font-family: var(--font-noto);
        /* No text/selection anywhere — this is a kiosk-style gallery, not a
           document, and a stray drag-select easily fires instead of (or
           alongside) the custom drag-to-rotate gesture below. */
        user-select: none;
        -webkit-user-select: none;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      /* Same reasoning as the user-select rule above, for images: without
         this, starting a drag on the button/goggle SVGs (or the canvas in
         some browsers) can kick off the browser's native "drag this image
         out" ghost instead of/alongside the custom pointer-driven drag. */
      img, svg, canvas {
        -webkit-user-drag: none;
        user-drag: none;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
      }
      #hud-1 {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }
      #hud-1 svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Top-left typewriter word readout (main.js's updateTypewriter),
         cycling through the focused object's translations. Sits above
         #hud-1 (100) so it always reads clearly as its own HUD label,
         regardless of the goggle frame/cutout underneath it.

         A fixed-height flex row, center-aligned: this is what keeps the
         cursor's Y position rock-solid across every script this readout
         ever shows, without the per-language baseline correction this used
         to need (Arabic/Chinese fonts sit noticeably lower than the rest of
         this font stack, since each script here comes from a *different*
         font file with its own ascent/descent metrics — text laid out the
         ordinary inline way shares one baseline across those metrics, so
         the cursor visibly jumped every time the language changed). Flex
         centering only cares about each child's own box height, not its
         font's baseline, and the cursor (see below) has its own fixed
         height completely independent of #word-typewriter-text's font —
         so its center is identical no matter what's typed next to it. */
      #word-typewriter {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 150;
        pointer-events: none;
        display: flex;
        align-items: center;
        height: 24px;
        color: #fff64a;
        font-family: var(--font-word-pop);
        font-size: 20px;
        font-weight: 100;
        white-space: nowrap;
      }
      /* A plain drawn bar, not a "|" glyph — a glyph would still be laid
         out (and thus vertically positioned) according to whichever font
         ends up rendering it, reintroducing the same per-script jitter this
         is meant to fix. A fixed-size box has no such font dependency: its
         height (and so its centered position in the flex row above) never
         changes, regardless of #word-typewriter-text's current language. */
      #word-typewriter-cursor {
        flex: none;
        width: 1px;
        height: 20px;
        margin-left: 3px;
        background: currentColor;
        animation: word-typewriter-blink 1s step-end infinite;
      }
      @keyframes word-typewriter-blink {
        50% {
          opacity: 0;
        }
      }
      /* Debug-mode-only object picker (main.js's renderDebugObjectList) —
         one row per wall object's id, click to jump the camera there via
         the same focusObject() the auto-advance/random-object button use.
         Hidden outside debug mode (setDebugMode toggles .visible); starts
         below #word-typewriter (which keeps running in debug mode too) so
         the two top-left overlays don't sit on top of each other. */
      #debug-object-list {
        display: none;
        position: fixed;
        top: 60px;
        left: 18px;
        z-index: 300;
        flex-direction: column;
        max-height: calc(100vh - 80px);
        overflow-y: auto;
        font-family: var(--font-noto);
        font-size: 13px;
      }
      #debug-object-list.visible {
        display: flex;
      }
      #debug-object-list button {
        all: unset;
        cursor: pointer;
        padding: 2px 8px;
        color: rgba(255, 255, 255, 0.75);
        white-space: nowrap;
      }
      #debug-object-list button:hover {
        color: #fff075;
        background: rgba(255, 255, 255, 0.12);
      }
      /* Real (unmasked) copy of the goggle shape, painted transparent and
         sitting on top of #hud1-frame in the same SVG — its only job is
         hit-testing. #hud-1 is pointer-events: none so clicks fall through
         to the canvas everywhere except here, where this element opts back
         into auto: fill="transparent" (not "none") still counts as
         "painted" for hit-testing, so the shape is interactive despite
         being invisible, and its bounds are exactly the visible cutout's
         since main.js sizes/shapes it identically to the mask's own path
         (see applyGoggleMaskBox/loadGoggleMask). The pointerdown/move/up
         listeners for drag-to-rotate are attached to the outer, never-
         replaced #hud1-svg rather than this element directly (which
         loadGoggleMask() swaps out wholesale once the live shape loads) —
         they still only ever fire from within this shape, since it's the
         only thing under #hud1-svg with pointer-events on, and the event
         bubbles up to it either way. */
      #hud1-goggle-hit {
        pointer-events: auto;
        cursor: grab;
      }
      #hud1-goggle-hit:active {
        cursor: grabbing;
      }
      /* Set on #hud1-svg while debugMode's free-roam TrackballControls is
         active, so this shape stops intercepting drag input from the whole
         canvas underneath it. */
      #hud1-svg.goggle-hit-disabled #hud1-goggle-hit {
        pointer-events: none;
      }
      #btn-random-object {
        position: fixed;
        left: 50%;
        bottom: 30px;
        z-index: 200;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        pointer-events: auto;
        opacity: 1;
        /* translateX(-50%) is relative to the element's own width, so its
           midpoint (not its left edge) lands on the 50% viewport line —
           folded into the transform below since it overwrites `transform`
           wholesale, not just the rotation.

           Rotation is built from two main.js-driven custom properties:
           --spin is an integer turn count, bumped once per press+release
           cycle (on pointerup); --tilt is -14deg while pressed and 0deg the
           rest of the time. Press (pointerdown) tilts counter-clockwise by
           transitioning --tilt to -14deg — a quick hop, using this rule's
           own 0.25s transition. Release (pointerup) bumps --spin AND resets
           --tilt to 0deg together, so the *absolute* target jumps straight
           from spin*360-14 to (spin+1)*360 in one motion — a bit over one
           full clockwise revolution — landing directly upright, visually
           identical to the very first rotation before any of this happened
           (main.js switches to a slower transition-duration for this step,
           so the spin actually reads as a spin). Building everything off
           --spin like this (rather than resetting to a fixed 0deg/-14deg)
           keeps every step's jump small and intentional instead of an
           arbitrary numeric gap that the transition would otherwise cover
           unnaturally fast. */
        transform: translateX(-50%) rotate(calc(var(--spin, 0) * 360deg + var(--tilt, 0deg)));
        transition: transform 0.25s ease;
      }
      #btn-random-object svg {
        display: block;
        width: 3dvw;
        height: 3dvw;
        fill: #fff64a;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="status">불러오는 중...</div>
      <div id="word-typewriter"><span id="word-typewriter-text"></span><span id="word-typewriter-cursor"></span></div>
      <div id="debug-object-list"></div>

      <!-- Goggle-shaped porthole frame. Its fill (id="hud1-frame") is driven
           from main.js, in sync with the scene background color. The
           viewBox width (id="hud1-svg") and this mask's/frame's rect widths
           are also kept in sync with the window's actual aspect ratio from
           main.js (syncHudViewBox()) — with a fixed 1920x1080 viewBox,
           "slice" crops whichever dimension overflows the real window
           aspect ratio, which cropped the now-edge-to-edge goggle shape's
           left/right sides on any window that wasn't exactly 16:9. -->
      <div id="hud-1">
        <svg id="hud1-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
          <defs>
            <mask id="hud1-porthole-mask">
              <rect id="hud1-mask-bg" width="1920" height="1080" fill="white" />
              <!-- Fallback shape for before main.js fetches the live
                   source/layout/goggle.svg (see loadGoggleMask() there) and
                   replaces this element outright — kept as a baked copy of
                   that file's current path so the two never visibly
                   disagree, since (with no loading screen) this can be
                   visible for a moment on a slow load. Re-copy the path
                   here whenever that source file's shape changes. -->
              <svg id="hud1-goggle-shape" viewBox="0 0 1975.98 1038.2" preserveAspectRatio="xMidYMid meet">
                <path fill="black" d="M1811.84,167.41C1651.52,16.7,1396.05,0,987.99,0S324.47,16.7,164.15,167.41C28.29,295.13,0,419.56,0,554.87c0,145.68,77.51,446.18,387.46,477.1,271.45,27.08,373.56-36.1,431.81-150.06,30.76-60.18,70.43-157.62,99.16-236.13,28.23-77.15,57.15-80.61,69.56-80.61s41.33,3.45,69.56,80.61c28.73,78.51,68.4,175.96,99.16,236.13,58.25,113.96,160.36,177.14,431.8,150.06,309.95-30.92,387.46-331.42,387.46-477.1,0-135.31-28.29-259.74-164.15-387.46Z" />
              </svg>
            </mask>
          </defs>

          <rect id="hud1-frame" width="1920" height="1080" fill="#292929" mask="url(#hud1-porthole-mask)" />

          <!-- Real (unmasked) copy of the goggle shape, purely for hit-testing
               — see the #hud1-goggle-hit CSS rule above. Kept as a baked
               fallback copy of the same path as hud1-goggle-shape above until
               main.js's loadGoggleMask() replaces both with the live one. -->
          <svg id="hud1-goggle-hit" viewBox="0 0 1975.98 1038.2" preserveAspectRatio="xMidYMid meet">
            <path fill="transparent" d="M1811.84,167.41C1651.52,16.7,1396.05,0,987.99,0S324.47,16.7,164.15,167.41C28.29,295.13,0,419.56,0,554.87c0,145.68,77.51,446.18,387.46,477.1,271.45,27.08,373.56-36.1,431.81-150.06,30.76-60.18,70.43-157.62,99.16-236.13,28.23-77.15,57.15-80.61,69.56-80.61s41.33,3.45,69.56,80.61c28.73,78.51,68.4,175.96,99.16,236.13,58.25,113.96,160.36,177.14,431.8,150.06,309.95-30.92,387.46-331.42,387.46-477.1,0-135.31-28.29-259.74-164.15-387.46Z" />
          </svg>
        </svg>
      </div>

      <!-- Bottom-right: the random-object button (jumps to a different
           random object, excluding the last 3 seen). This inline svg is only
           the fallback shown before loadButtonIcon() fetches the live
           source/icon/re.svg (copied to public/icon/ by
           scripts/generate-assets.mjs) and replaces it outright — kept as a
           baked copy of that file's current path so the two never visibly
           disagree, since (with no loading screen) this can be visible for
           a moment on a slow load. Re-copy the path here whenever that
           source file changes. -->
      <button id="btn-random-object" type="button" aria-label="랜덤 오브제">
        <svg viewBox="0 0 273.93 304.92">
          <path d="M242.65,239.55c-18.91,22.91-44.88,39.13-73.54,46.04l43.35,13.6-1.8,5.73-51.72-16.23,16.23-51.72,5.72,1.8-13.18,42.02c58.9-14.06,101.22-67.36,101.22-128.36,0-46.96-25.28-90.77-65.98-114.31l2.5-4.33c42.24,24.44,68.48,69.89,68.48,118.64,0,31.74-11.11,62.68-31.28,87.12Z"/>
          <path d="M98.76,67.95l-5.72-1.8,13.18-42.02C47.32,38.19,5,91.49,5,152.49c0,46.96,25.28,90.77,65.98,114.31l-2.5,4.33C26.24,246.69,0,201.23,0,152.49c0-31.74,11.11-62.68,31.28-87.12,18.91-22.91,44.88-39.13,73.54-46.04L61.47,5.73l1.8-5.73,51.72,16.23-16.23,51.72Z"/>
        </svg>
      </button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
