<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Observing 3D Viewer</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        gap: 8px;
      }
      #ui select {
        padding: 8px 12px;
        border-radius: 8px;
        border: none;
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
      }
      #status {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 10;
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="ui">
        <select id="model-select"></select>
      </div>
      <div id="status">불러오는 중...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
